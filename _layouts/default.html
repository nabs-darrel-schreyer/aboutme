<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="site-header">
    {% include nav.html %}
  </header>
  <main class="site-main {% if page.hero %}site-main--home{% endif %}">
    {% if page.hero %}
    <section class="hero">
      <div class="hero__inner">
        <div class="hero__copy">
          <p class="hero__eyebrow">Senior full-stack &amp; applied AI engineer (.NET, React, Azure)</p>
          <h1 class="hero__title">{{ site.title }}</h1>
          <p class="hero__lead">{{ site.description }}</p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="{{ '/skills/' | relative_url }}">View skills showcase</a>
            <a class="btn btn--ghost" href="{{ '/about/' | relative_url }}">About how I work</a>
          </div>
        </div>
        <div class="hero__photo" aria-hidden="false">
          <img src="{{ '/assets/images/profile.jpg' | relative_url }}" alt="Portrait of Darrel Schreyer" width="220" height="220">
        </div>
      </div>
    </section>
    {% endif %}
    <article class="prose {% if page.collection_style %}prose--{{ page.collection_style }}{% endif %}">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">
    <p>Built as a living CV - evidence first, narrative second.</p>
    <p><a href="https://github.com/nabs-darrel-schreyer/aboutme">Source on GitHub</a></p>
  </footer>
  <script>
    (function () {
      var btn = document.querySelector('[data-nav-toggle]');
      var menu = document.getElementById('nav-menu');
      if (!btn || !menu) return;
      btn.addEventListener('click', function () {
        var open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        menu.classList.toggle('is-open', !open);
      });
    })();
  </script>
</body>
</html>
